<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trace sessions — trace-viewer</title><meta name="description" content="A connected view of development findings, decisions, and conversations."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23ed623f'/%3E%3Cpath d='M12 29V11m0 12c12 0 16-4 16-12' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body>

<div class="app">
